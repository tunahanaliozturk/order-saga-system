name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build and saga unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors in Directory.Build.props, so this is the analyzer and style gate too.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      # The state machine runs on an in-memory bus, so every transition and every compensation path is
      # covered in a couple of seconds without Docker.
      - name: Saga state machine tests
        run: dotnet run --project tests/OrderSaga.UnitTests --configuration Release --no-build

  integration:
    name: integration suite
    runs-on: ubuntu-latest
    # Four services, real Postgres, real RabbitMQ, and every failure path driven on purpose. This is the
    # job that decides whether the compensation claims in the README are true.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration and compensation tests
        run: dotnet run --project tests/OrderSaga.IntegrationTests --configuration Release --no-build

  compose:
    name: docker compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # The README promises this works. Nothing keeps that true except running it.
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 420

      - name: Place an order and wait for it to complete
        run: |
          set -euo pipefail
          order=$(curl -sf localhost:5000/orders \
            -H 'Content-Type: application/json' \
            -d '{"customerId":"11111111-1111-1111-1111-111111111111","lines":[{"sku":"22222222-2222-2222-2222-222222222222","quantity":1,"unitPrice":9.99}]}' \
            | jq -r .id)

          echo "order $order"

          for _ in $(seq 1 60); do
            status=$(curl -sf "localhost:5000/orders/$order" | jq -r .status)
            echo "status $status"
            [ "$status" = "Completed" ] && exit 0
            [ "$status" = "Cancelled" ] && { echo "unexpected cancellation"; exit 1; }
            sleep 2
          done

          echo "order never completed"
          exit 1

      - name: Show service state
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down --volumes
